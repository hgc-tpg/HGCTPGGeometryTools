[project]
requires-python = ">= 3.10"
name = "geometrychecking"
version = "0.3.0"
dependencies = [
  "matplotlib",
  "snakemake",
  "uproot",
  "awkward",
  "numpy",
  "pandas",
  "click",
  "shapely",
  "pyarrow",
  "papermill"
]

[tool.setuptools.packages]
find = {}

[project.scripts]
extract-geometry = "geometrychecking.data:cli"
create-geojson = "geometrychecking.geometry:cli"
plot = "geometrychecking.plotting:cli"
